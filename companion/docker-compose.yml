# WalkieTales remote: one web remote for all your WalkieTales players, on a home server.
# Start it with `docker compose up -d`, then open http://<this server>:8090 on your phone.
# Update it with `docker compose pull && docker compose up -d`.
services:
  walkie-tales-remote:
    image: ghcr.io/jaso1000/walkie-tales-remote:latest
    # To build from source instead of pulling the published image, comment out the line above and uncomment this one:
    # build: .
    container_name: walkie-tales-remote
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8490:8490"   # the same remote over https, needed for recording voice messages (accept the certificate warning once)
    volumes:
      - walkie-tales-data:/data   # the players you add in the app, and the https certificate
    environment:
      # This server's address (e.g. 192.168.1.50), written into the https certificate. Optional, but set it before the
      # first start: the certificate is made once (delete /data/tls in the volume to make a new one).
      HTTPS_HOSTS: ""
      # Optional starting player(s). You can also add players in the app (tap the name at the top),
      # or let it find them on the Wi-Fi. Format for several: "Riv=http://192.168.1.50:8080,Sam=http://192.168.1.51:8080"
      PLAYERS: ""
      # Optional: extra networks to search with "Find players on the Wi-Fi", e.g. "192.168.2"
      # SCAN_SUBNETS: ""

volumes:
  walkie-tales-data:
