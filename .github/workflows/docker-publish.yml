name: Publish Docker image

# Builds the WalkieTales remote (companion/) and publishes it to GitHub's container registry, so anyone can run it
# with `docker compose up -d` without building it themselves. Same approach as WalkerLab's docker-publish.yml.
# Runs when main changes the remote, when a release is tagged (vX.Y also gets its own image tag), or by hand
# (Actions → Publish Docker image → Run workflow), e.g. to pick up a security fix in the base image.
on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/docker-publish.yml'
    tags: ['v*']
  workflow_dispatch:

env:
  # Lowercase on purpose: GHCR rejects uppercase in image names.
  IMAGE: ghcr.io/jaso1000/walkie-tales-remote

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 as well as amd64, so it also runs on a Raspberry Pi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest from main, :1.44 from a v1.44 tag, and :<commit> for every build
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=v(.*),group=1
            type=sha,format=long,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: companion
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
