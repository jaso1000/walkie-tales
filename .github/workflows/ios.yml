name: iOS build

on:
  push:
    paths: ["ios/**", "companion/web/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen ldid

      - name: Bundle the remote page and icons
        run: |
          mkdir -p ios/WalkieTales/Resources/web
          cp companion/web/index.html ios/WalkieTales/Resources/web/index.html

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project WalkieTales.xcodeproj -scheme WalkieTales -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/WalkieTales.app

      - name: Fake-sign with entitlements and package the IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/WalkieTales.app
          ldid -SWalkieTales/WalkieTales.entitlements "$APP/WalkieTales"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry WalkieTales.ipa Payload
          ls -la WalkieTales.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WalkieTales-ipa
          path: ios/WalkieTales.ipa

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project WalkieTales.xcodeproj -scheme WalkieTales -configuration Release             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild             CODE_SIGNING_ALLOWED=NO build > simbuild.log 2>&1 || { grep -E "error:" -A3 simbuild.log | head -80; exit 1; }
          # sign it locally with the app's entitlements (keychain), like the real install, so the test sees the same
          codesign -f -s - --entitlements WalkieTales/WalkieTales.entitlements simbuild/Build/Products/Release-iphonesimulator/WalkieTales.app

      - name: Run in an iPhone simulator and take screenshots
        working-directory: ios
        run: bash simtest.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: ios/shots/

      - name: Show build errors
        if: failure()
        working-directory: ios
        run: grep -E "error:" -A3 build.log | head -150 || true
